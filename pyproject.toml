[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senior-voice-assistant"
version = "0.1.0"
description = "Asistente de voz local de baja latencia para personas mayores"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "loguru",
    "numpy",
    "onnxruntime",
    "openwakeword",
    "pydantic>=2.0",
    "pydantic-settings",
    "sounddevice",
]

[project.scripts]
senior-voice-assistant = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "src*"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
